[package]
name = "movie_worker"
version = "0.1.0"
edition = "2021"
description = "Background jobs for the movie streaming stack (probe, transcode, scrape, ingest)"
license = "MIT"

[[bin]]
name = "movie_worker"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
bytes = "1"

# S3-compatible: MinIO, AWS S3, R2, Wasabi, B2.
# Cliente S3 minimalista inline (sin SDK pesado) usando reqwest + hmac/sha2.
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"